# =====================================================================
# mynet.local — Nginx 本地开发环境（全静态/PHP-FPM，无 proxy_pass）
# =====================================================================
#
# 安装:
#   ln -sf /Users/arthur/Devel/WorkSpaceAI/mynet-club/mynet_ctl/scripts/nginx/mynet-local.conf \
#          /usr/local/etc/nginx/servers/mynet-local.conf
#   sudo nginx -s reload
#
# 前置条件:
#   1. /etc/hosts 添加:
#      127.0.0.1 api.mynet.local admin.mynet.local ctl.mynet.local my.mynet.local www.mynet.local
#   2. php-fpm 正在运行 (brew services start php)
#   3. 各 Laravel 项目已 composer install && php artisan key:generate
#   4. 前端项目已构建: bash scripts/build-local.sh
#
# 架构（全部直接伺服，不使用 proxy_pass）:
#   api.mynet.local   → mynet_api  (php-fpm, Laravel)
#   admin.mynet.local → mynet_api  (php-fpm, Laravel)
#   ctl.mynet.local   → mynet_ctl   (php-fpm, Laravel, Vite 产物在 public/build/)
#   my.mynet.local    → mynet_gui   (Quasar SPA 静态文件 dist/spa/)
#   www.mynet.local   → mynet_web   (Vue3 SPA 静态文件 dist/)
# =====================================================================

# ── api.mynet.local / admin.mynet.local → mynet_api (PHP-FPM) ──
server {
    listen       80;
    listen       443 ssl;
    server_name  api.mynet.local admin.mynet.local;

    ssl_certificate     /Users/yue/.nginx/certs/mynet.local.pem;
    ssl_certificate_key /Users/yue/.nginx/certs/mynet.local.key;

    root /Users/arthur/Devel/WorkSpaceAI/mynet-club/mynet_api/public;
    index index.php;

    charset utf-8;
    client_max_body_size 100M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass   127.0.0.1:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;

        fastcgi_param  HTTP_HOST $host;
        fastcgi_param  SERVER_NAME $host;

        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout    60s;
        fastcgi_read_timeout    60s;
        fastcgi_buffering       off;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    access_log /usr/local/var/log/nginx/mynet-back-access.log;
    error_log  /usr/local/var/log/nginx/mynet-back-error.log;
}

# ── ctl.mynet.local → mynet_ctl (PHP-FPM) ──
server {
    listen       80;
