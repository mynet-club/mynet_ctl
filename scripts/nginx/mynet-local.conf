# ── my.mynet.local → mynet_gui (Quasar SPA 静态文件) ──
server {
    listen       80;
    listen       443 ssl;
    server_name  my.mynet.local;

    ssl_certificate     /Users/yue/.nginx/certs/mynet.local.pem;
    ssl_certificate_key /Users/yue/.nginx/certs/mynet.local.key;

    root /Users/arthur/Devel/WorkSpaceAI/mynet-club/mynet_gui/dist/spa;
    index index.html;

    charset utf-8;

    # SPA fallback — 所有路由返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存（Vite hash 文件名保证 cache-bust）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    access_log /usr/local/var/log/nginx/mynet-gui-access.log;
    error_log  /usr/local/var/log/nginx/mynet-gui-error.log;
}

# ── www.mynet.local → mynet_web (Vue3 SPA 静态文件) ──
server {
    listen       80;
    listen       443 ssl;
    server_name  www.mynet.local;

    ssl_certificate     /Users/yue/.nginx/certs/mynet.local.pem;
    ssl_certificate_key /Users/yue/.nginx/certs/mynet.local.key;

    root /Users/arthur/Devel/WorkSpaceAI/mynet-club/mynet_web/dist;
    index index.html;

    charset utf-8;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    access_log /usr/local/var/log/nginx/mynet-web-access.log;
    error_log  /usr/local/var/log/nginx/mynet-web-error.log;
}
