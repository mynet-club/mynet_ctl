server {
    listen 80;
    listen [::]:80;
    server_name ctl.mynet.club;

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 172.26.3.227:443 ssl http2;
    listen 127.0.0.1:443 ssl http2;
    server_name ctl.mynet.club;

    # ── Laravel public ──
    root /data/app/mynet.club/ctl/public;
    index index.php index.html;

    # ── SSL（共享泛域名证书）──
    # ⚠️ 目录带 -0001 后缀（2026-09-25 核正，此前写的是 mynet.club/）。
    #    依据：凭证库 arthur/misc/ssl/CERT_PATH = mynet.club-0001/，
    #    CERT_EXPIRY=2026-12-11 与线上证书 notAfter 一致，SAN=*.mynet.club+mynet.club。
    #    上机核对：ls -d /etc/letsencrypt/live/mynet.club*
    ssl_certificate /etc/letsencrypt/live/mynet.club-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mynet.club-0001/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── 安全头 ──
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Gzip ──
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ── Laravel 路由 ──
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── API CORS ──
    location /api/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Zone-ID" always;
        add_header Access-Control-Expose-Headers "Content-Length,Content-Range,X-Script-Checksum" always;

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Zone-ID";
            add_header Content-Type "text/plain; charset=utf-8";
            add_header Content-Length 0;
            return 204;
        }

        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── /d/ 分发路由（CORS + 无缓存）──
    location /d/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── 静态资源 ──
    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf|js|css|ico|svg|woff2?)$ {
        expires 30d;
        access_log off;
    }

    # ── favicon / robots ──
    location = /favicon.ico { access_log off; log_not_found off; expires 30d; }
    location = /robots.txt  { access_log off; log_not_found off; expires 30d; }

    # ── 健康检查 ──
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ── 禁止敏感文件 ──
    location ~ /\.(?!well-known).* { deny all; }
    location ~ ^/(\.env|composer\.(json|lock)|package\.json|\.git) { deny all; }
    location ~* /(storage|bootstrap|config|database|resources|tests)/ { deny all; }

    # ── PHP-FPM ──
    # 服务器使用 /run/php/php8.2-fpm.sock
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;

        fastcgi_hide_header X-Powered-By;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
        fastcgi_read_timeout 240;
        fastcgi_send_timeout 240;

        fastcgi_param PHP_VALUE "upload_max_filesize=100M \n post_max_size=100M";
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 443;
    }

    # ── 错误页 ──
    error_page 404 /index.php;
    error_page 500 502 503 504 /50x.html;

    # ── 日志 ──
    access_log /data/log/nginx/ctl.mynet.club.access.log;
    error_log  /data/log/nginx/ctl.mynet.club.error.log;

    # ── 限制 ──
    client_max_body_size 100M;
    client_body_timeout 60s;
    client_header_timeout 60s;
}
