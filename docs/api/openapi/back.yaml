  # T18 补全（2026-09-21）：代码有、OpenAPI 未声明的端点
  #
  # 来源：mynet_back app/Modules/VPN/routes/api.php。注意该模块**原生前缀是 /api/v1**，
  # /api/v2 由 RewriteApiVersion 中间件重写而来（bootstrap/app.php 中 prepend），
  # 故此处 server 前缀 /api/v2 与实际路由可对应。
  #
  # 刻意**不**纳入：
  #   - /auth/{login,register,logout,forgot-password,reset-password}：framework-owned，
  #     由 dsplat MultiTenantSaas 各模块提供，契约归属框架，本文件不重复声明。
  #   - POST /channels/{enterprise-wechat,wechat-official}/webhook：第三方回调、无认证、
  #     非客户端 API，如需文档化应单列 webhooks tag 且不生成 SDK。
  #
  # 刻意**不**新增（语义重复或仅缺 method，见文末「缺 method」说明）：
  #   /users/profile≈/user、/nodes/{id}/config 的 POST≈PUT、/nodes/{id}/keys 的 PUT、
  #   /route/{id} 的 PATCH、/tenants/{id} 的 PATCH、/ippools/{sequence}≈/ippools/{id}
  # ══════════════════════════════════════════════════════════════════════════

